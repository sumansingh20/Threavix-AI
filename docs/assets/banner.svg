<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Threavix, agentic AI for cyber threat intelligence and incident response">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060b"/>
      <stop offset="0.55" stop-color="#08131f"/>
      <stop offset="1" stop-color="#04141c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#123047" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <g transform="translate(1000 170)">
    <circle r="145" fill="#061a24" opacity="0.55"/>
    <g fill="none" stroke="#22d3ee" stroke-opacity="0.32" stroke-width="1.2">
      <circle r="145"/>
      <circle r="108"/>
      <circle r="71"/>
      <circle r="34"/>
    </g>
    <line x1="-145" y1="0" x2="145" y2="0" stroke="#22d3ee" stroke-opacity="0.22"/>
    <line x1="0" y1="-145" x2="0" y2="145" stroke="#22d3ee" stroke-opacity="0.22"/>
    <g>
      <path d="M0 0 L145 0 A145 145 0 0 0 0 -145 Z" fill="url(#sweep)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle cx="74" cy="-52" r="4" fill="#5eead4">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;5;2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-46" cy="86" r="4" fill="#7dd3fc">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;5;2" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="102" cy="64" r="4" fill="#a5b4fc">
      <animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;5;2" dur="2.9s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-96" cy="-34" r="4" fill="#5eead4">
      <animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;5;2" dur="3.4s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <line x1="0" y1="0" x2="0" y2="-145" stroke="#7dd3fc" stroke-width="1.6" stroke-opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="5" fill="url(#title)" filter="url(#glow)">THREAVIX</text>
  <text x="82" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#c9d6e3">Agentic AI for Cyber Threat Intelligence and Incident Response</text>
  <text x="84" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#5f7d93">FastAPI    LangGraph    MITRE ATT&amp;CK    NIST SP 800-61    VirusTotal</text>

  <line x1="80" y1="262" x2="470" y2="262" stroke="#1d4257" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.25;0.9;0.25" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
