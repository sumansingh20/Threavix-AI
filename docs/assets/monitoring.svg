<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Threavix telemetry dashboard">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0ea5b7"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="320" fill="url(#mbg)"/>
  <rect x="24" y="22" width="536" height="276" rx="14" fill="#0c1524" stroke="#1b3350" stroke-width="1.4"/>
  <rect x="584" y="22" width="392" height="276" rx="14" fill="#0c1524" stroke="#1b3350" stroke-width="1.4"/>

  <text x="48" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7dd3fc" font-weight="600" letter-spacing="1">threat_intel_queries_total</text>
  <text x="48" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#5f7d93">per tool, last 15 minutes</text>

  <g>
    <rect x="56" y="200" width="34" height="40" rx="5" fill="url(#bar)">
      <animate attributeName="height" values="40;130;70;140;95;40" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="200;110;170;100;145;200" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="128" y="150" width="34" height="90" rx="5" fill="url(#bar)">
      <animate attributeName="height" values="90;55;135;80;120;90" dur="6s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="150;185;105;160;120;150" dur="6s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="120" width="34" height="120" rx="5" fill="url(#bar)">
      <animate attributeName="height" values="120;85;45;130;70;120" dur="6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;155;195;110;170;120" dur="6s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="272" y="170" width="34" height="70" rx="5" fill="url(#bar)">
      <animate attributeName="height" values="70;125;95;50;140;70" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="170;115;145;190;100;170" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="344" y="140" width="34" height="100" rx="5" fill="url(#bar)">
      <animate attributeName="height" values="100;60;130;90;50;100" dur="6s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="140;180;110;150;190;140" dur="6s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="416" y="185" width="34" height="55" rx="5" fill="url(#bar)">
      <animate attributeName="height" values="55;115;75;135;95;55" dur="6s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="185;125;165;105;145;185" dur="6s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <line x1="48" y1="240" x2="510" y2="240" stroke="#1e3a55" stroke-width="1.4"/>
  </g>

  <text x="608" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#a5b4fc" font-weight="600" letter-spacing="1">agent latency</text>
  <text x="608" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#5f7d93">p50 and p95, seconds</text>

  <path id="lat" d="M612 220 L664 190 L716 205 L768 150 L820 168 L872 120 L924 140 L960 108"
        fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="620" stroke-dashoffset="620">
    <animate attributeName="stroke-dashoffset" values="620;0;0;620" keyTimes="0;0.55;0.85;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <circle cx="960" cy="108" r="5" fill="#a5b4fc">
    <animate attributeName="r" values="3;7;3" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(700 250)">
    <circle r="34" fill="none" stroke="#173453" stroke-width="7"/>
    <circle r="34" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="150 214" stroke-dashoffset="54">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#5eead4">up</text>
  </g>
  <text x="770" y="238" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#7f9bb3">healthy</text>
  <text x="770" y="258" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#7f9bb3">database</text>
  <text x="770" y="280" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#5f7d93">Grafana + Prometheus</text>
</svg>
